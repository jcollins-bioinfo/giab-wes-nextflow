forbidden_without_new_evidence:
  - historical professional Nextflow tenure
  - clinical-grade or patient-care validation
  - production-proven workflow or production use
  - canonical HG001 alignment, dual-caller execution or benchmarking
  - generalization beyond HG001 or a universal caller winner
  - cloud-tested, SLURM-tested or Seqera-observed execution
  - native Apple Silicon DeepVariant support or executed emulation
  - independent Colab architecture/runtime qualification from a mirror metadata field
  - published pipeline v1.0, deployed Explorer or website research results
  - assay-wide recall from a depth-conditioned primary domain
claim_rules:
  - Distinguish raw observations, derived metrics and engineering interpretation.
  - A configured profile is not an executed environment.
  - A public build check is not a public HTTP deployment test.
  - Full HG001 DeepVariant results require the documented training-overlap limitation.
  - Chr20–22 sensitivity is a same-individual locus analysis, not population generalization.

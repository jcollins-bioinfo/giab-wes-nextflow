    repository_sha: d933578401d305bc8504e584f2aaa5f484085e18
    evidence: docs/orchestration/evidence/baseline-website.json
    limitation: No GIAB page/Explorer or current public HTTP verification is established.
  - id: approved-coding-domain
    classification: inferred
    statement: Owner approval selected the fixed GENCODE v50 coding-domain estimand on 2026-09-08.
    evidence: docs/adr/0013-approved-domain-colab-and-prototype.md
    limitation: Approval records intent; canonical materialization, real HG001 execution and benchmarking remain unverified.
  - id: synthetic-explorer
    classification: locally-tested
    statement: The separately packaged synthetic explorer passed installed-wheel tests and browser checks.
    evidence: explorer/README.md
    limitation: No canonical results, caller winner, production deployment or M8 completion.
  - id: colab-capability-launcher
    classification: locally-tested
    statement: The owner supplied a Colab runtime report from commit 676718ed6c02c3076a26b48fb82d684251fb7892; its 43-file package inventory was consistency-checked.
    evidence: docs/canonical-colab.md
    limitation: Owner-supplied report, not cryptographic remote attestation; 50.99 GiB RAM and absent Docker do not qualify index construction or canonical execution.

  - id: m5-synthetic-verification
    classification: CI-tested
    statement: Retained CI34270789172 and identical-tree post-merge CI34272289311 establish actual BCFtools/RTG normalization, representation matching, isolation, independent/both equivalence and resume.
    evidence: docs/orchestration/evidence/m5-verified-34270789172.json
    limitation: Invented M5 representations and accepted M4 SNV interface only; resource parsing and cache attribution are not canonical caller-cost estimates; HG001 metrics remain unavailable.

  - id: approved-coding-domain-reproduced
    classification: locally-tested
    statement: Package constructor reproduced the three owner-approved domain hashes from exact pinned annotation, FAI and confidence inputs.
    evidence: docs/orchestration/evidence/coding-domain-reproduced.json
    limitation: In-memory coordinate verification only; no reference-base, index, runtime or canonical processing qualification.

  - id: canonical-colab-interface
    classification: locally-tested
    statement: Exact-SHA Colab launch, full-reference classic BWA fallback, independent BQSR qualification, gated caller comparison and durable restart are implemented.
    evidence: docs/canonical-analysis.md
    limitation: Local tests use invented data and mocked execution where stated; real Colab reference/index/runtime/HG001 execution remains unqualified.
  - id: canonical-public-consumer
    classification: locally-tested
    statement: Canonical result model verifies external manifest identity, exact file inventory, domain, arithmetic, comparison symmetry and required receipts; Dash exposes the validated view and safe exports.
    evidence: docs/canonical-results-contract.md
    limitation: Model-valid declarations do not independently attest execution; a trusted reviewed manifest from a completed real run is still required.
  - id: canonical-cloud-profiles
    classification: configured_only
    statement: Colab, Apptainer, Docker, SLURM, AWS Batch and Wave configuration interfaces exist and parse.
    evidence: docs/canonical-runtime.md
    limitation: No canonical cloud execution, paid compute or public deployment is inferred from configuration.

forbidden_without_new_evidence:
  - historical professional Nextflow tenure
  - clinical-grade or patient-care validation
  - production-proven workflow or production use
  - canonical HG001 alignment, dual-caller execution or benchmarking
  - generalization beyond HG001 or a universal caller winner
  - cloud-tested, SLURM-tested or Seqera-observed execution
  - native Apple Silicon DeepVariant support or executed emulation
  - independent Colab architecture/runtime qualification from a mirror metadata field
  - published pipeline v1.0, deployed Explorer or website research results
  - assay-wide recall from a depth-conditioned primary domain
claim_rules:
  - Distinguish raw observations, derived metrics and engineering interpretation.
  - A configured profile is not an executed environment.
  - A public build check is not a public HTTP deployment test.
  - Full HG001 DeepVariant results require the documented training-overlap limitation.
  - Chr20–22 sensitivity is a same-individual locus analysis, not population generalization.

name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NXF_ANSI_LOG: false
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: pre-commit run --all-files
      - run: python scripts/validate_contracts.py
      - run: python -m unittest discover -s tests/unit -v
      - run: python tests/data/generate_fixture.py
      - run: python scripts/check_samplesheets.py
      - run: python scripts/check_repository.py
  nextflow:
    strategy:
      fail-fast: false
      matrix: {nextflow: ['25.10.4', '26.04.6']}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@7a445ee88d4e23b52c33cc6c5c278fd3ecb4c38e # v4.7.1
        with: {distribution: temurin, java-version: '17'}
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with: {version: "${{ matrix.nextflow }}"}
      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with: {version: '0.9.5'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install nf-core==4.1.0
      - run: python tests/data/generate_fixture.py
      - if: matrix.nextflow == '25.10.4'
        run: echo 'NXF_SYNTAX_PARSER=v2' >> "$GITHUB_ENV"
      - run: nextflow -version
      - run: nextflow lint -o concise .
      - run: nf-core pipelines schema lint
      - run: nf-core pipelines lint --show-passed
      - run: nf-test test --ci
      - run: rm -rf work results .nextflow* && nextflow run . -profile test,docker
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "failure-${{ matrix.nextflow }}", path: ".nextflow.log*", include-hidden-files: true}
  required:
    if: always()
    needs: [python, nextflow]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.python.result }}' = success && test '${{ needs.nextflow.result }}' = success

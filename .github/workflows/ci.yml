name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NXF_ANSI_LOG: false
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: pre-commit run --all-files
      - run: python scripts/validate_contracts.py
      - run: python -m unittest discover -s tests/unit -v
      - run: python tests/data/generate_fixture.py
      - run: python scripts/check_samplesheets.py
      - run: python scripts/check_repository.py
  nextflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ubuntu-24.04 exposes its preinstalled JDK 17 through JAVA_HOME_17_X64.
      # Select and verify it directly rather than depending on an additional action.
      - name: Select Java 17
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with: {version: "26.04.6"}
      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with: {version: '0.9.5'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install nf-core==4.1.0
      - run: python tests/data/generate_fixture.py
      - run: nextflow -version
      - run: nextflow lint -o concise .
      - run: nf-core pipelines schema lint
      - run: nf-core pipelines lint --show-passed
      - run: nf-test test --ci
      - run: rm -rf work results .nextflow* && nextflow run . -profile test,docker
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: failure-nextflow-26.04.6, path: ".nextflow.log*", include-hidden-files: true}
  required:
    if: always()
    needs: [python, nextflow]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.python.result }}' = success && test '${{ needs.nextflow.result }}' = success

name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NXF_ANSI_LOG: false
jobs:
  python:
    strategy:
      fail-fast: true
      matrix: {python-version: ['3.12', '3.13']}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Validate all committed JSON and notebooks
        run: git ls-files '*.json' '*.ipynb' | xargs -n1 python -m json.tool >/dev/null
      - name: Install deterministic development and build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build sdist and wheel
        run: python -m build
      - name: Test installed wheel outside checkout
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import giab_wes_nextflow; from giab_wes_nextflow.resources import config_path,schema_path; assert config_path('m2-resources.json').is_file(); assert schema_path('m2-source-manifest.schema.json').is_file(); print(giab_wes_nextflow.__version__)"
          for command in acquire prepare validate publish mirror; do /tmp/wheel-venv/bin/giab-wes-${command}-m2 --help >/dev/null; done
          before=$(find /tmp -maxdepth 1 -name m2-stage -print)
          /tmp/wheel-venv/bin/giab-wes-acquire-m2 --workspace /tmp/m2-stage --preflight-only >/dev/null
          test "$before" = "$(find /tmp -maxdepth 1 -name m2-stage -print)"
      - run: python -m pip install -e .
      - name: Formatting and pre-commit
        run: pre-commit run --all-files
      - name: Contract and M2 manifest preflight
        run: |
          python scripts/validate_contracts.py
          python scripts/validate_m2.py
          python scripts/acquire_m2.py --workspace /tmp/m2-stage --preflight-only
      - name: Complete Python unit and negative suite
        run: python -m unittest discover -s tests/unit -v
      - name: Generate deterministic fixture before samplesheet validation
        run: |
          python tests/data/generate_fixture.py
          python scripts/check_samplesheets.py
      - name: Repository hygiene
        run: python scripts/check_repository.py
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-python-${{ matrix.python-version }}
          path: .pytest_cache
          if-no-files-found: ignore
  nextflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ubuntu-24.04 exposes its preinstalled JDK 17 through JAVA_HOME_17_X64.
      # Select and verify it directly rather than depending on an additional action.
      - name: Select Java 17
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with: {version: "26.04.6"}
      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with: {version: '0.9.5'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: python -m pip install nf-core==4.1.0
      - run: python tests/data/generate_fixture.py
      - run: nextflow -version
      - run: nextflow lint -o concise .
      - run: nf-core pipelines schema lint
      - run: nf-core pipelines lint --show-passed
      - run: nf-test test --ci
      - run: rm -rf work results .nextflow* && nextflow run . -profile test,docker
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: failure-nextflow-26.04.6, path: ".nextflow.log*", include-hidden-files: true}
  required:
    if: always()
    needs: [python, nextflow]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.python.result }}' = success && test '${{ needs.nextflow.result }}' = success

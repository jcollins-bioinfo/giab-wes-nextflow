name: AWS cloud validation (no deployment)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install checksum-verified Terraform
        run: |
          version=1.13.5
          curl --fail --location --retry 3 -O "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_amd64.zip"
          curl --fail --location --retry 3 -O "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS"
          grep " terraform_${version}_linux_amd64.zip$" "terraform_${version}_SHA256SUMS" | sha256sum --check -
          unzip "terraform_${version}_linux_amd64.zip" -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"
      - name: Validate without AWS credentials or backend access
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          terraform -chdir=infra/aws fmt -check -recursive
          terraform -chdir=infra/aws init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test
  cloud-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install ".[aws]" pytest==8.4.2
      - run: python -m pytest -q tests/unit/test_aws*.py
      - run: python -m pytest -q tests/unit/test_cloud*.py
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914
        with: {version: '26.04.6'}
      - name: Parse profiles and lint cloud workflow without scheduling
        run: |
          nextflow config -profile cloud_awsbatch -flat > /tmp/batch.config
          nextflow config -profile cloud_healthomics -flat > /tmp/healthomics.config
          nextflow lint -o concise cloud.nf
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build support and Explorer linux/amd64 images
        run: |
          docker build --platform linux/amd64 -f containers/support.Dockerfile -t giab-support:ci .
          docker run --rm giab-support:ci python -c 'import giab_wes_nextflow.cloud_contract'
          docker build --platform linux/amd64 -f explorer/Dockerfile -t giab-explorer:ci .
      - name: Verify non-root read-only Explorer health and claim boundary
        run: |
          docker run --detach --name explorer --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8050:8050 giab-explorer:ci
          python explorer/container_smoke.py
          test "$(docker exec explorer id -u)" = 10001
      - name: Container diagnostics
        if: always()
        run: docker logs explorer || true

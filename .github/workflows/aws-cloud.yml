name: AWS cloud validation (no deployment)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install checksum-verified Terraform
        run: |
          version=1.13.5
          curl --fail --location --retry 3 -O "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_amd64.zip"
          curl --fail --location --retry 3 -O "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS"
          grep " terraform_${version}_linux_amd64.zip$" "terraform_${version}_SHA256SUMS" | sha256sum --check -
          unzip "terraform_${version}_linux_amd64.zip" -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"
      - name: Validate without AWS credentials or backend access
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          terraform -chdir=infra/aws fmt -check -recursive
          terraform -chdir=infra/aws init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test
          terraform -chdir=infra/hosting-lightsail init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/hosting-lightsail validate
  cloud-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install ".[aws]" pytest==8.4.2
      - run: python -m pytest -q tests/unit/test_aws*.py
      - run: python -m pytest -q tests/unit/test_cloud*.py
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914
        with: {version: '26.04.6'}
      - name: Parse profiles and lint cloud workflow without scheduling
        run: |
          nextflow config -profile cloud_awsbatch -flat > /tmp/batch.config
          nextflow config -profile cloud_healthomics -flat > /tmp/healthomics.config
          nextflow lint -o concise cloud.nf
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build support and Explorer linux/amd64 images
        run: |
          docker build --platform linux/amd64 -f containers/support.Dockerfile -t giab-support:ci .
          docker run --rm giab-support:ci python -c 'import giab_wes_nextflow.cloud_contract'
          docker build --platform linux/amd64 -f explorer/Dockerfile -t giab-explorer:ci .
      - name: Verify non-root read-only Explorer health and claim boundary
        run: |
          docker run --detach --name explorer --memory=512m --memory-swap=512m --cpus=0.25 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8050:8050 giab-explorer:ci
          python explorer/container_smoke.py
          test "$(docker exec explorer id -u)" = 10001
          python explorer/memory_probe.py
          docker exec explorer cat /sys/fs/cgroup/memory.peak > /tmp/explorer-memory-peak.bytes
          docker image inspect --format '{{.Id}}' giab-explorer:ci > /tmp/explorer-image-id.txt
          docker inspect --format '{{.State.OOMKilled}}' explorer > /tmp/explorer-oom.txt
          python - <<'PYCODE'
          import json, pathlib
          peak=int(pathlib.Path('/tmp/explorer-memory-peak.bytes').read_text())
          oom=pathlib.Path('/tmp/explorer-oom.txt').read_text().strip()=='true'
          report={'image_config_digest':pathlib.Path('/tmp/explorer-image-id.txt').read_text().strip(),'limit_bytes':536870912,'peak_bytes':peak,'oom_killed':oom,
                  'scope':'synthetic evidence; 4 clients; 240 requests; 0.25 CPU',
                  'nano_memory_candidate':not oom and peak<=429496729}
          print(json.dumps(report,indent=2))
          pathlib.Path('/tmp/explorer-memory.json').write_text(json.dumps(report,indent=2))
          assert not oom and peak<=429496729, 'Nano requires at least 20% measured headroom'
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: explorer-memory
          path: /tmp/explorer-memory.json
          retention-days: 14
      - name: Container diagnostics
        if: always()
        run: docker logs explorer || true

  engine-26040:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {parser: ['v1', 'v2']}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914
        with: {version: '26.04.0'}
      - name: Real container cache and workflow-output probes
        run: |
          python scripts/qualification/nextflow_engine.py --nextflow "$(command -v nextflow)" \
            --work "$RUNNER_TEMP/engine-probe" --parser '${{ matrix.parser }}' \
            --container-image 'python:3.13-slim-bookworm@sha256:2f2e5a876c71a6757f55ec57f2add0225ddaf01c802a33fcc29073943f94d907' \
            --alternate-container-image 'quay.io/biocontainers/samtools@sha256:a130447589651ed09252aa95a5e4f4132942cdb54d835d81a04a9a930d656561'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-26040-${{ matrix.parser }}
          path: |
            ${{ runner.temp }}/engine-probe/qualification.json
            ${{ runner.temp }}/engine-probe/*.tsv
            ${{ runner.temp }}/engine-probe/*.log
          retention-days: 14

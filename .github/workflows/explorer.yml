name: Explorer prototype
on:
  pull_request:
    paths: ['explorer/**', 'src/giab_wes_nextflow/**', 'tests/unit/test_canonical_host.py', '.github/workflows/explorer.yml', 'notebooks/canonical_capability_colab.ipynb']
permissions:
  contents: read
jobs:
  explorer:
    runs-on: ubuntu-24.04
    strategy:
      matrix: {python-version: ['3.12', '3.13']}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install ./explorer .
      - name: Test installed prototype and capability check
        run: |
          cd /tmp
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/explorer/tests" -v
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests/unit" -p test_canonical_host.py -v
